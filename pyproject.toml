[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "segmentation-individual"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pytest>=8.4.1",
    "segmentation_core==0.2.*",
]

[project.scripts]
segmentation = "segmentation.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true

[tool.uv.sources]
segmentation-core = { index = "course" } # hyphen (PEP 503 normalized)

[[tool.uv.index]]
name = "course"
url = "https://harvard-cs182-f25.github.io/segmentation/wheels/"
format = "simple"
explicit = true
