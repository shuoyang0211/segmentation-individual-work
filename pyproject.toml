[project]
name = "segmentation"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8.4.1",
    "ruff>=0.12.10",
    "segmentation_core==0.2.*"
]

[project.scripts]
segmentation = "segmentation.__main__:main"

[tool.uv]
package = true

[tool.uv.sources]
segmentation-core = { index = "course" } # hyphen (PEP 503 normalized)

[[tool.uv.index]]
name = "course"
url = "https://harvard-cs182-f25.github.io/segmentation/wheels/"
format = "simple"
explicit = true
